[package]
name = "deepshrink-core"
description = "DeepShrink core: pure, testable logic (size parsing, presets, engine contract)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["ffmpeg"]
# The ffmpeg-backed media engine (probe / run / estimate). Off, the crate is the
# pure planning logic only — what an iOS app links (it encodes with AVFoundation).
ffmpeg = ["dep:deepshrink-ffmpeg"]

[dependencies]
thiserror.workspace = true
deepshrink-ffmpeg = { workspace = true, optional = true }
